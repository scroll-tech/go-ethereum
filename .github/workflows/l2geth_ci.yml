name: CI

on:
  push:
    branches: # we keep this to avoid triggering `push` & `pull_request` every time we update a PR
      - main
      - staging
      - develop
      - alpha
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-geth:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26.x
        # Only the test job saves the Go cache, so it keeps the full build cache.
        cache: false

    - name: Build
      run: |
        make geth

  check:
    # if: github.event.pull_request.draft == false
    if: false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26.x
        # Only the test job saves the Go cache, so it keeps the full build cache.
        cache: false

    - name: Lint
      run: |
        rm -rf $HOME/.cache/golangci-lint
        make lint

  goimports-lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # Go >= 1.19 reformats doc comments; bumping requires a repo-wide reformat.
        go-version: 1.18.x

    - name: Install goimports
      run: go install golang.org/x/tools/cmd/goimports@v0.24.0

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - run: goimports -local github.com/scroll-tech/go-ethereum/ -w .

    # If there are any diffs from goimports, fail.
    - name: Verify no changes from goimports
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          exit 1
        fi

  go-mod-tidy-lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26.x
        # Only the test job saves the Go cache, so it keeps the full build cache.
        cache: false

    - run: go mod tidy

    # If there are any diffs from go mod tidy, fail.
    - name: Verify no changes from go mod tidy
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          exit 1
        fi

  govulncheck:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # Same version as the Dockerfile builder: govulncheck checks the stdlib of this Go.
        go-version: 1.26.8
        # Only the test job saves the Go cache, so it keeps the full build cache.
        cache: false

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

    - name: Check geth for called vulnerabilities
      env:
        # Accepted: GO-2026-6278 (gorilla/websocket, client side only),
        # GO-2022-0300 (graphql-go, needs the MaxDepth option, which geth does not set).
        ACCEPTED: GO-2026-6278 GO-2022-0300
      run: |
        govulncheck -format json ./cmd/geth > govulncheck.json
        found=$(jq -r 'select(.finding.trace[0].function != null) | .finding.osv' govulncheck.json | sort -u)
        unexpected=$(comm -23 <(echo "$found") <(tr ' ' '\n' <<< "$ACCEPTED" | sort -u))
        if [ -n "$unexpected" ]; then
          echo "geth calls code with these vulnerabilities:"
          echo "$unexpected"
          govulncheck ./cmd/geth || true
          exit 1
        fi

  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26.x

    - name: Test
      run: |
        make test
