name: CI

on:
  push:
    branches: # we keep this to avoid triggering `push` & `pull_request` every time we update a PR
      - main
      - staging
      - develop
      - alpha
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  build-geth:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.x

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Build
      run: |
        make geth

  check:
    # if: github.event.pull_request.draft == false
    if: false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.x

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Lint
      run: |
        rm -rf $HOME/.cache/golangci-lint
        make lint

  goimports-lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        # Go >= 1.19 reformats doc comments; bumping requires a repo-wide reformat.
        go-version: 1.18.x

    - name: Install goimports
      run: go install golang.org/x/tools/cmd/goimports@v0.24.0

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - run: goimports -local github.com/scroll-tech/go-ethereum/ -w .

    # If there are any diffs from goimports, fail.
    - name: Verify no changes from goimports
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          exit 1
        fi

  go-mod-tidy-lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.x

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - run: go mod tidy

    # If there are any diffs from go mod tidy, fail.
    - name: Verify no changes from go mod tidy
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          exit 1
        fi

  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.x

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Test
      run: |
        make test

    - name: Upload coverage report
      run: bash <(curl -s https://codecov.io/bash)
